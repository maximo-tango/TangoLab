<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maximo Tango · Tango Waveform Lab</title>
<link rel="icon" type="image/png" sizes="512x512" href="../assets/favicon/favicon.png">
<link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f2;--panel:#fff;--ink:#1b1f2a;--sub:#5d6575;--line:#d5d9e0;--wave:#2f3a7a;--wave2:#8e97c9;--ph:#0f8a7e;--br:#d2402b;--en:#b7791f;--cand:rgba(210,64,43,.14);--play:#1b1f2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13151c;--panel:#1c1f29;--ink:#eceef3;--sub:#9aa2b3;--line:#323747;--wave:#9aa6ff;--wave2:#4b548f;--ph:#35c4b4;--br:#ff6a55;--en:#e9b44c;--cand:rgba(255,106,85,.16);--play:#eceef3}}
:root[data-theme="dark"]{--bg:#13151c;--panel:#1c1f29;--ink:#eceef3;--sub:#9aa2b3;--line:#323747;--wave:#9aa6ff;--wave2:#4b548f;--ph:#35c4b4;--br:#ff6a55;--en:#e9b44c;--cand:rgba(255,106,85,.16);--play:#eceef3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
p.lead{margin:0 0 16px;color:var(--sub);max-width:60ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
button,select,input[type=file]{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--sub)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--wave);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--sub)}
.drop.on{border-color:var(--wave);color:var(--ink)}
#scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#inner{position:relative;height:190px}
#cv{display:block;height:190px}
#bands,#marks{position:absolute;inset:0;pointer-events:none}
.band{position:absolute;top:0;bottom:22px;background:var(--cand)}
.mk{position:absolute;top:0;bottom:22px;width:0;border-left:2px solid var(--c);pointer-events:auto;cursor:pointer}
.mk span{position:absolute;top:2px;left:3px;background:var(--c);color:#fff;font-size:11px;line-height:1;padding:3px 5px;border-radius:3px;white-space:nowrap}
#head{position:absolute;top:0;bottom:0;width:2px;background:var(--play);pointer-events:none}
.now{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline;margin:10px 0 2px}
#clock{font-variant-numeric:tabular-nums;font-size:20px;font-weight:600}
#next{font-size:18px;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
.t-phrase{--c:var(--ph)}.t-break{--c:var(--br)}.t-end{--c:var(--en)}
.btnmk{border-left:6px solid var(--c)}
table{width:100%;border-collapse:collapse}
td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
td input{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px;width:100%}
td input:focus{border-color:var(--line)}
.tm{font-variant-numeric:tabular-nums;white-space:nowrap}
textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
small,.hint{color:var(--sub)}
[hidden]{display:none!important}

:root:root:root{--ph:#2ee6d0;--br:#ff4d38;--en:#ffc23d;--cand:rgba(255,77,56,.22);--wave:#f4f4f4;padding-top:0}
.hero{background:#000;color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 58px;clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 36px))}
.hero-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.hero img{height:92px;width:auto;filter:invert(1)}
.hero h1{font-size:30px;font-style:italic;font-weight:600;margin:0;letter-spacing:-.02em}
.hero p{margin:4px 0 0;color:#b9bcc6;max-width:48ch;font-size:14px}
main{padding-top:0}
.panel{border-radius:4px}
.drop{background:#0b0b0e;border:2px dashed #ff4d38;color:#b9bcc6}
.drop.on{border-color:#fff;color:#fff}
.drop p,.drop input{color:#fff}
button.primary{background:#ff4d38;border-color:#ff4d38;color:#000;font-weight:600;font-size:16px;min-height:46px;padding:8px 24px;transform:skewX(-10deg)}
button.btnmk{background:#0b0b0e;color:#fff;border:1px solid #2a2a33;border-left:6px solid var(--c);font-weight:600;transform:skewX(-10deg)}
#scroll{background:#09090c;border-color:#000}
#head{background:#fff;box-shadow:0 0 10px #fff}
.mk span{color:#000;font-weight:600}
#clock{font-size:36px;font-style:italic;font-weight:600;line-height:1}
#next{font-size:22px;font-style:italic;font-weight:600}
.mk.auto{border-left-style:dashed}
</style>
</head>
<body>
<header class="hero"><div class="hero-in"><img alt="MAXIMO TANGO" src="../assets/images/maximo-tango.png"><div><h1>탱고 파형 학습</h1><p>곡을 불러오면 파형이 그려지고, 재생하면서 프레이즈·쉼·마무리 지점을 찍을 수 있어요. 음악 파일은 이 기기 안에서만 열리고 어디에도 올라가지 않아요.</p></div></div></header>
<main>

<div id="drop" class="drop panel">
  <p style="margin:0 0 10px">음악 파일(mp3, wav, m4a)을 여기에 끌어놓거나 선택하세요</p>
  <input id="file" type="file" accept="audio/*">
</div>

<section id="app" hidden>
  <div class="panel">
    <div class="row" style="margin-bottom:10px">
      <button id="play" class="primary" style="min-width:84px">재생</button>
      <select id="rate" aria-label="재생 속도"><option value="0.5">0.5배속</option><option value="0.75">0.75배속</option><option value="1" selected>1배속</option></select>
      <label class="hint">확대 <input id="zoom" type="range" min="10" max="140" value="40"></label>
      <label class="hint"><input id="cand" type="checkbox"> 쉼 후보 보기</label>
    </div>
    <div id="scroll"><div id="inner"><canvas id="cv"></canvas><div id="bands"></div><div id="marks"></div><div id="head"></div></div></div>
    <div class="now"><span id="clock">0:00.0</span><span id="next" class="hint">다음 쉼까지 -</span></div>
    <p class="hint" style="margin:0">파형을 누르면 그 위치로 이동해요. 재생 중 단축키: P 프레이즈, B 쉼, E 마무리, 스페이스 재생/정지.</p>
  </div>

  <div class="panel">
    <div class="row">
      <button class="btnmk t-phrase" data-type="phrase">프레이즈 찍기 (P)</button>
      <button class="btnmk t-break" data-type="break">쉼 찍기 (B)</button>
      <button class="btnmk t-end" data-type="end">마무리 찍기 (E)</button>
    </div>
    <div class="row" style="margin-top:10px"><button id="auto">자동 분석으로 표시</button><label class="hint">민감도 <select id="sens"><option value="0.7">낮음</option><option value="1" selected>보통</option><option value="1.4">높음</option></select></label><button id="clr">자동 표시 지우기</button></div>
    <p id="amsg" class="hint" style="margin:8px 0 0"></p>
    <table id="list" aria-label="표시한 지점"></table>
    <p id="empty" class="hint" style="margin:8px 0 0">아직 찍은 지점이 없어요. 재생하다가 버튼이나 단축키로 표시해 보세요.</p>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:8px">
      <button id="exp">지점 복사하기</button>
      <button id="imp">붙여넣은 지점 불러오기</button>
      <small id="msg"></small>
    </div>
    <textarea id="io" placeholder="복사한 지점 데이터가 여기에 나타나요. 학생에게 보낼 때는 이 내용을 전달하고, 받은 사람은 여기에 붙여넣어 불러오세요." spellcheck="false"></textarea>
  </div>
</section>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var TYPES={phrase:"프레이즈",break:"쉼",end:"마무리"};
var audio=new Audio(),buf=null,peaks=null,dur=0,pps=40,marks=[],cands=[],key="",rms=null;
var cv=$("cv"),ctx=cv.getContext("2d"),inner=$("inner"),scroll=$("scroll");

function fmt(t){var m=Math.floor(t/60),s=t-m*60;return m+":"+(s<10?"0":"")+s.toFixed(1)}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

function load(f){
  if(!f)return;
  var url=URL.createObjectURL(f);audio.src=url;audio.preservesPitch=true;
  var rd=new FileReader();
  rd.onload=function(){
    var AC=window.AudioContext||window.webkitAudioContext,ac=new AC();
    ac.decodeAudioData(rd.result,function(b){
      buf=b;dur=b.duration;analyze();key="tw:"+f.name+":"+Math.round(dur);
      try{marks=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){marks=[]}
      $("drop").hidden=true;$("app").hidden=false;fit();if(!marks.length)autoRun();draw();renderMarks();tick();ac.close()
    },function(){alert("이 파일은 열 수 없어요. mp3, wav, m4a 파일로 다시 시도해 보세요.")});
  };
  rd.readAsArrayBuffer(f);
}

function analyze(){
  var n=buf.length,ch=buf.numberOfChannels,sr=buf.sampleRate,d=[];
  for(var c=0;c<ch;c++)d.push(buf.getChannelData(c));
  var blk=Math.floor(sr/100),cnt=Math.floor(n/blk);
  peaks=new Float32Array(cnt*2);var e=rms=new Float32Array(cnt);
  for(var i=0;i<cnt;i++){
    var mn=1,mx=-1,sum=0;
    for(var j=i*blk;j<(i+1)*blk;j+=2){var v=0;for(var c2=0;c2<ch;c2++)v+=d[c2][j];v/=ch;
      if(v<mn)mn=v;if(v>mx)mx=v;sum+=v*v}
    peaks[i*2]=mn;peaks[i*2+1]=mx;e[i]=Math.sqrt(sum/(blk/2));
  }
  // 50ms 단위 에너지에서 평균보다 많이 낮은 구간 = 쉼 후보
  var w=5,arr=[],tot=0;
  for(var k=0;k+w<=cnt;k+=w){var s=0;for(var q=0;q<w;q++)s+=e[k+q];arr.push(s/w);tot+=s/w}
  var th=tot/arr.length*0.2;cands=[];var st=-1;
  for(var a=0;a<=arr.length;a++){
    var low=a<arr.length&&arr[a]<th;
    if(low&&st<0)st=a;
    if(!low&&st>=0){var len=(a-st)*0.05;if(len>=0.15&&st*0.05>1)cands.push([st*0.05,a*0.05]);st=-1}
  }
}

function fit(){
  var want=Math.max(10,Math.min(140,Math.floor((scroll.clientWidth-2)/dur)));
  $("zoom").value=Math.max(want,+$("zoom").min);pps=+$("zoom").value;
}

function draw(){
  if(!buf)return;
  var W=Math.ceil(dur*pps),H=190,wh=H-22;
  cv.width=W;cv.height=H;cv.style.width=W+"px";inner.style.width=W+"px";
  var wave=css("--wave"),w2=css("--wave2"),line="#3a3a44",sub="#9a9aa6";
  ctx.clearRect(0,0,W,H);
  var mid=wh/2;
  ctx.fillStyle=wave;
  for(var x=0;x<W;x++){
    var a=Math.floor(x/pps*100),b=Math.max(a+1,Math.floor((x+1)/pps*100)),mn=1,mx=-1;
    for(var i=a;i<b&&i*2+1<peaks.length;i++){if(peaks[i*2]<mn)mn=peaks[i*2];if(peaks[i*2+1]>mx)mx=peaks[i*2+1]}
    if(mn>mx)continue;
    var y1=mid-mx*mid*0.95,y2=mid-mn*mid*0.95;
    ctx.fillRect(x,y1,1,Math.max(1,y2-y1));
  }
  ctx.fillStyle=line;ctx.fillRect(0,wh,W,1);
  ctx.fillStyle=sub;ctx.font="11px sans-serif";
  var step=pps>=80?2:pps>=40?5:10;
  for(var t=0;t<=dur;t+=step){var px=t*pps;ctx.fillRect(px,wh,1,5);ctx.fillText(Math.floor(t/60)+":"+("0"+(t%60)).slice(-2),px+3,H-6)}
  drawBands();renderMarks();
}

function drawBands(){
  var h="";
  if($("cand").checked)cands.forEach(function(c){h+='<div class="band" style="left:'+c[0]*pps+'px;width:'+Math.max(2,(c[1]-c[0])*pps)+'px"></div>'});
  $("bands").innerHTML=h;
}

function save(){try{localStorage.setItem(key,JSON.stringify(marks))}catch(e){}}

function renderMarks(){
  marks.sort(function(a,b){return a.t-b.t});
  var m="",l="";
  marks.forEach(function(k,i){
    m+='<div class="mk t-'+k.type+(k.auto?' auto':'')+'" data-i="'+i+'" style="left:'+k.t*pps+'px"><span>'+esc(k.label)+'</span></div>';
    l+='<tr class="t-'+k.type+'"><td style="width:20px"><span class="dot"></span></td><td class="tm"><button data-go="'+i+'" aria-label="이 지점으로 이동">'+fmt(k.t)+'</button></td><td>'+TYPES[k.type]+(k.auto?' (자동)':'')+'</td><td><input data-lb="'+i+'" value="'+esc(k.label)+'" aria-label="이름"></td><td style="width:60px"><button data-del="'+i+'" aria-label="삭제">삭제</button></td></tr>';
  });
  $("marks").innerHTML=m;$("list").innerHTML=l;$("empty").hidden=marks.length>0;save();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function addMark(type){
  if(!buf)return;
  var n=marks.filter(function(k){return k.type===type}).length+1;
  marks.push({t:Math.round(audio.currentTime*10)/10,type:type,label:TYPES[type]+" "+n});renderMarks();
}

function tick(){
  var t=audio.currentTime;
  $("clock").textContent=fmt(t)+" / "+fmt(dur);
  $("head").style.left=t*pps+"px";
  var nb=marks.filter(function(k){return k.type==="break"&&k.t>t+0.05})[0],el=$("next");
  el.textContent=nb?"다음 쉼까지 "+(nb.t-t).toFixed(1)+"초":"다음 쉼 없음";
  el.style.color=nb&&nb.t-t<2?css("--br"):"";
  if(!audio.paused){
    var x=t*pps;if(x<scroll.scrollLeft||x>scroll.scrollLeft+scroll.clientWidth-40)scroll.scrollLeft=Math.max(0,x-60);
  }
  requestAnimationFrame(tick);
}


function findBreaks(sens){
  var out=[],n=rms.length,w=5,m=Math.floor(n/w),ag=0,i;
  for(i=0;i<n;i++)ag+=rms[i];ag/=n;
  var th=ag*0.2*sens,st=-1;
  for(var a=0;a<=m;a++){
    var s=0,ended=a<m;
    if(ended){for(var q=0;q<w;q++)s+=rms[a*w+q];s/=w}
    var low=ended&&s<th;
    if(low&&st<0)st=a;
    if(!low&&st>=0){
      var t0=st*0.05,len=(a-st)*0.05;
      if(ended&&len>=0.15&&t0>1){
        var p1=Math.round(t0*100),p0=Math.max(0,p1-100),ps=0,ds=0,c=0,k;
        for(k=p0;k<p1;k++)ps+=rms[k];ps/=Math.max(1,p1-p0);
        for(k=st*w;k<a*w;k++){ds+=rms[k];c++}
        if(ds/c<0.35*ps)out.push(t0);
      }
      st=-1;
    }
  }
  return out;
}

function findPhrases(sens){
  var d=buf.getChannelData(0),sr=buf.sampleRate,hop=Math.floor(sr/20),N=Math.floor(d.length/hop),F=[[],[],[]];
  var a1=Math.exp(-2*Math.PI*200/sr),a2=Math.exp(-2*Math.PI*2000/sr),l1=0,l2=0,i,j,b,k;
  for(i=0;i<N;i++){
    var sq=[0,0,0];
    for(j=i*hop;j<(i+1)*hop;j++){var x=d[j];l1=a1*l1+(1-a1)*x;l2=a2*l2+(1-a2)*x;var mi=l2-l1,hi=x-l2;sq[0]+=l1*l1;sq[1]+=mi*mi;sq[2]+=hi*hi}
    for(b=0;b<3;b++)F[b].push(Math.log(1e-4+Math.sqrt(sq[b]/hop)));
  }
  var n=rms.length,o=new Float32Array(n);
  for(i=1;i<n;i++)o[i]=Math.max(0,rms[i]-rms[i-1]);
  // 박 간격(0.3~1.0초)을 자기상관으로 추정하고, 4박 단위 마디 위치를 맞춤
  var bl=50,bv=-1;
  for(var L=30;L<=100;L++){var v=0;for(k=L;k<n;k++)v+=o[k]*o[k-L];v/=(n-L);if(v>bv){bv=v;bl=L}}
  var U=bl*4,ph=0,pv=-1;
  for(var p=0;p<U;p++){var v2=0;for(k=p+1;k<n-1;k+=U)v2+=o[k-1]+o[k]+o[k+1];if(v2>pv){pv=v2;ph=p}}
  var P=F.map(function(f){var c=[0];for(var q=0;q<f.length;q++)c.push(c[q]+f[q]);return c});
  function mean(bd,a,z){a=Math.max(0,a);z=Math.min(N,z);return z>a?(P[bd][z]-P[bd][a])/(z-a):0}
  var W=Math.max(40,Math.round(U*0.4)),cand=[];
  for(var t=ph;t*0.01<dur-4;t+=U){
    if(t*0.01<4)continue;
    var fr=Math.round(t*0.01/0.05),nv=0;
    for(b=0;b<3;b++){var df=mean(b,fr-W,fr)-mean(b,fr,fr+W);nv+=df*df}
    cand.push({t:t*0.01,v:Math.sqrt(nv)});
  }
  if(!cand.length)return [];
  var mu=0,sd=0;cand.forEach(function(c){mu+=c.v});mu/=cand.length;
  cand.forEach(function(c){sd+=(c.v-mu)*(c.v-mu)});sd=Math.sqrt(sd/cand.length);
  var th=mu+0.5*sd/sens,gap=Math.max(6,U*0.03),pick=[];
  cand.slice().sort(function(a,b2){return b2.v-a.v}).forEach(function(c){
    if(c.v<=th)return;
    if(pick.every(function(q){return Math.abs(q-c.t)>=gap}))pick.push(c.t);
  });
  return pick.sort(function(a,b2){return a-b2});
}

function autoRun(){
  if(!buf)return;
  var sens=+$("sens").value,nb=0,np=0;
  marks=marks.filter(function(k){return !k.auto});
  findBreaks(sens).forEach(function(t){nb++;marks.push({t:Math.round(t*10)/10,type:"break",label:"쉼 "+nb,auto:true})});
  findPhrases(sens).forEach(function(t){np++;marks.push({t:Math.round(t*10)/10,type:"phrase",label:"프레이즈 "+np,auto:true})});
  renderMarks();
  $("amsg").textContent="자동으로 쉼 "+nb+"개, 프레이즈 "+np+"곳을 표시했어요(점선). 틀린 곳은 지우고, 이름을 고치면 확정돼서 다시 분석해도 남아요.";
}

function seek(t){audio.currentTime=Math.max(0,Math.min(dur,t))}

$("file").onchange=function(e){load(e.target.files[0])};
var dz=$("drop");
["dragover","dragenter"].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add("on")})});
["dragleave","drop"].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove("on")})});
dz.addEventListener("drop",function(e){load(e.dataTransfer.files[0])});

$("play").onclick=function(){audio.paused?audio.play():audio.pause()};
audio.onplay=function(){$("play").textContent="정지"};
audio.onpause=function(){$("play").textContent="재생"};
audio.onended=function(){$("play").textContent="재생"};
$("rate").onchange=function(){audio.playbackRate=+this.value};
$("zoom").oninput=function(){pps=+this.value;var t=audio.currentTime;draw();scroll.scrollLeft=Math.max(0,t*pps-scroll.clientWidth/2)};
$("cand").onchange=drawBands;
inner.addEventListener("click",function(e){
  var mk=e.target.closest(".mk");
  if(mk){seek(marks[+mk.dataset.i].t);return}
  seek((e.clientX-inner.getBoundingClientRect().left)/pps);
});
document.querySelectorAll("[data-type]").forEach(function(b){b.onclick=function(){addMark(b.dataset.type)}});
$("list").addEventListener("click",function(e){
  var g=e.target.closest("[data-go]"),d=e.target.closest("[data-del]");
  if(g)seek(marks[+g.dataset.go].t);
  if(d){marks.splice(+d.dataset.del,1);renderMarks()}
});
$("list").addEventListener("change",function(e){
  var i=e.target.dataset.lb;if(i!=null){marks[+i].label=e.target.value||TYPES[marks[+i].type];delete marks[+i].auto;renderMarks()}
});
document.addEventListener("keydown",function(e){
  if(!buf||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  var k=e.key.toLowerCase();
  if(k===" "){e.preventDefault();$("play").click()}
  else if(k==="p")addMark("phrase");else if(k==="b")addMark("break");else if(k==="e")addMark("end");
});
$("exp").onclick=function(){
  var ta=$("io");ta.value=JSON.stringify({v:1,marks:marks});ta.select();
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){$("msg").textContent="복사했어요"},function(){});
  $("msg").textContent=ok?"복사했어요":"위 내용을 직접 복사해 주세요";
};
$("imp").onclick=function(){
  try{var o=JSON.parse($("io").value);
    if(!o||!Array.isArray(o.marks))throw 0;
    marks=o.marks.filter(function(k){return typeof k.t==="number"&&TYPES[k.type]}).map(function(k){return{t:k.t,type:k.type,label:String(k.label||TYPES[k.type]),auto:k.auto?true:undefined}});
    renderMarks();$("msg").textContent=marks.length+"개 지점을 불러왔어요";
  }catch(e){$("msg").textContent="형식이 맞지 않아요. 복사한 내용을 그대로 붙여넣어 주세요"}
};
$("auto").onclick=autoRun;
$("clr").onclick=function(){marks=marks.filter(function(k){return !k.auto});renderMarks();$("amsg").textContent="자동 표시를 지웠어요"};
window.addEventListener("resize",function(){if(buf)draw()});
})();
</script>
</body>
</html>
